name: Publicar site e API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fastapi-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Obter código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verificar configuração do deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: |
          if [ -z "$FASTAPI_CLOUD_TOKEN" ] || [ -z "$FASTAPI_CLOUD_APP_ID" ]; then
            echo "Cadastre FASTAPI_CLOUD_TOKEN e FASTAPI_CLOUD_APP_ID nos secrets do repositório."
            exit 1
          fi

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Compilar site
        run: |
          npm ci
          npm run build --workspace=8values-textos

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências e ferramenta de deploy
        run: python -m pip install -r api/requirements.txt "fastapi[standard]>=0.115,<1" "fastapi-cloud-cli>=0.9.0" "setuptools>=68" wheel

      - name: Verificar site e API no pacote instalado
        run: |
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir "$RUNNER_TEMP/deploy-wheel"
          python scripts/verify-deploy.py "$RUNNER_TEMP"/deploy-wheel/oito_valores-*.whl

      - name: Publicar site e API
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: fastapi deploy
