<text x="825" y="592.0" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#363636">Sim</text>
<text x="690" y="675.0" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#363636">Não</text>
