[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oito-valores"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "typesafe-sdk>=0.7,<1",
    "openai>=2,<4",
    "tiktoken>=0.8,<1",
    "nltk>=3.9,<4",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
]

[tool.fastapi]
entrypoint = "api.app.main:app"

[tool.setuptools.packages.find]
include = ["api", "api.app", "api.app.*"]
exclude = ["*.__pycache__*", "api.app.pipeline.resources*"]

[tool.setuptools.package-data]
api = ["analysis-config.json"]
"api.app.pipeline" = ["*.tiktoken", "resources/punkt_portuguese/*"]
